<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A black hole: the shadow, ringed by its lensed, Doppler-brightened glow -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff4e8"/>
      <stop offset="1" stop-color="#ff9a5a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#05070c"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="url(#ring)" stroke-width="5"/>
  <circle cx="32" cy="32" r="13.5" fill="#000"/>
</svg>
